<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050b16">
    <meta name="description" content="CHIERAM — 千恵が、しゃべる。">
    <title>CHIERAM</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23050b16'/%3E%3Cpath d='M18 18h28v8H26v12h20v8H18z' fill='%231c8cff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="boot-screen" id="bootScreen" aria-hidden="true">
      <div class="boot-box">
        <p>CHIERAM SYSTEM BOOTING...</p>
        <p>VOICE MODULE <span>READY</span></p>
        <p>SYSTEM <span>ONLINE</span></p>
      </div>
    </div>

    <main class="terminal" id="app">
      <div class="corner corner--tl" aria-hidden="true"></div>
      <div class="corner corner--tr" aria-hidden="true"></div>
      <div class="corner corner--bl" aria-hidden="true"></div>
      <div class="corner corner--br" aria-hidden="true"></div>

      <header class="system-header">
        <div>
          <p class="brand">CHIERAM</p>
          <p class="brand-sub">CHIE RESPONSE SYSTEM</p>
        </div>
        <div class="status" aria-label="システム準備完了">
          <span class="status-dot"></span> READY
        </div>
      </header>

      <section class="console" aria-labelledby="mainTitle">
        <div class="console-heading">
          <p class="eyebrow">VOICE TRANSMISSION CONSOLE</p>
          <h1 id="mainTitle">千恵が、しゃべる。</h1>
        </div>

        <div class="input-wrap">
          <label for="speechText">MESSAGE INPUT</label>
          <textarea id="speechText" rows="4" maxlength="500" placeholder="ここに文章を入力…" enterkeyhint="done"></textarea>
          <span class="input-mark" aria-hidden="true">TX-01</span>
        </div>

        <p class="message" id="message" role="status" aria-live="polite">音声モジュール待機中</p>

        <div class="button-grid">
          <button class="action-button action-button--speak" id="speakButton" type="button">
            <span class="button-icon" aria-hidden="true">▶</span>
            <span><strong>しゃべる</strong><small>SPEAK</small></span>
          </button>
          <button class="action-button action-button--stop" id="stopButton" type="button">
            <span class="button-icon" aria-hidden="true">■</span>
            <span><strong>停止</strong><small>STOP</small></span>
          </button>
        </div>

        <div class="controls">
          <div class="control-row">
            <div class="control-label">
              <label for="speed">SPEED</label>
              <output id="speedValue" for="speed">1.0x</output>
            </div>
            <input id="speed" type="range" min="0.7" max="1.5" step="0.1" value="1.0">
          </div>

          <div class="control-row">
            <div class="control-label">
              <label for="pitch">PITCH</label>
              <output id="pitchValue" for="pitch">1.1</output>
            </div>
            <input id="pitch" type="range" min="0.7" max="1.5" step="0.1" value="1.1">
          </div>
        </div>
      </section>

      <footer class="system-footer">
        <span>SYSTEM : <b>ONLINE</b></span>
        <span>CRS / 01</span>
      </footer>
    </main>
  </body>
</html>
